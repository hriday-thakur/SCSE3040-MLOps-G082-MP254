# MP254 findings --- fill in every value, keep every key.
# The marking tool reads this file. Write null only where the comment says so.
# Use the exact column names and group values from your data files.

group_id: "G082"          # your group id, e.g. "G042"
problem_id: "MP254"

data_issues:
  # For each of the 7 kinds: present: true or false.
  # If present is false, leave the other values as null.
  leaking_column:
    present: true
    column: "yield_from_mandi_receipt"           # the column that must not be used as a feature
  unit_mixup:
    present: true
    column: "fertilizer_kg"           # the column recorded in a different unit
    group_value: "Tehsil West"      # the value of tehsil whose rows are affected
    factor: 1000           # wrong value = right value x factor
  sentinel_value:
    present: false
    column: null
    value: null            # the special number typed instead of a blank
    count: null            # how many rows have it
  duplicate_rows:
    present: true
    count: 44            # number of EXTRA copies (rows you would delete)
  stuck_sensor:
    present: false
    column: null
    start_date: null       # first date with the stuck value, YYYY-MM-DD
    end_date: null         # last date with the stuck value, YYYY-MM-DD
  target_typos:
    present: false
    count: 0            # rows whose target was typed 10 times too big
  spelling_variants:
    present: true
    column: "seed_variety"
    true_levels: 
      - "PBW-343"
      - "DBW-187"
      - "HD-2967"      # how many real categories there are after cleaning

tracking:
  experiment_name: null
  best_run_id: null        # the MLflow run id of your v1 model
  registered_model_name: null
  champion_version: null

monitoring:
  psi:                     # cleaned train.csv vs later.csv, 10 bins
    rainfall_mm: null
    fertilizer_kg: null
    sowing_delay_days: null
    irrigation_count: null
    soil_ph: null
    farm_acres: null
  most_drifted_feature: null
  mae_by_group:            # v1 on later.csv, per value of tehsil
    'Tehsil North': null
    'Tehsil South': null
    'Tehsil West': null
  worst_served_group: null
  mae_v1_on_check: null    # v1 on the last 30% of later.csv (by date)
  mae_v2_on_check: null    # v2 on the same rows
  decision: null           # promote or keep
